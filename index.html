<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha D&D 2024</title>

   <link rel="stylesheet" href="style.css">
</head>
<script src="app.js"></script>
</body>
</html>
<body>

    <header class="topo">
        <div>
            <span class="logo">D&D</span>
            <span class="titulo">Gerenciador de Personagens</span>
        </div>
    </header>

    <main class="container">

        <section class="boas-vindas">
            <p class="etiqueta">DUNGEONS & DRAGONS 2024</p>

            <h1>Suas aventuras começam aqui.</h1>

            <p>
                Crie, organize e jogue com seus personagens
                em uma ficha digital feita para D&D 2024.
            </p>

            <button id="botaoTeste">
                Criar personagem
            </button>
        </section>

        <section class="status">
            <div class="status-icone">✓</div>

            <div>
                <strong>Plataforma funcionando</strong>
                <p id="mensagem">
                    HTML e CSS carregados corretamente.
                </p>
            </div>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
